<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Navy Squircle Background (#111A35) -->
  <rect width="240" height="240" rx="52" fill="#111A35" />
  
  <defs>
    <!-- Gradasi Hexagon Luar -->
    <linearGradient id="ep-fav-hex" x1="40" y1="30" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1D4ED8" />
      <stop offset="50%" stopColor="#1E40AF" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="ep-fav-box-left" x1="70" y1="90" x2="120" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1E3A8A" />
    </linearGradient>
    <linearGradient id="ep-fav-box-right" x1="120" y1="90" x2="175" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E40AF" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="ep-fav-box-top" x1="70" y1="70" x2="175" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F8FAFC" />
      <stop offset="50%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <linearGradient id="ep-fav-gold-swoosh" x1="100" y1="210" x2="215" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#FCD34D" />
    </linearGradient>
    <linearGradient id="ep-fav-shield" x1="90" y1="110" x2="150" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Hexagon Frame Luar -->
  <path d="M120 18 L195 62 L195 150 L120 194 L45 150 L45 62 Z" fill="url(#ep-fav-hex)" />

  <!-- Sayap Teal Kiri -->
  <path d="M45 130 C65 170 90 200 115 210 C95 200 70 175 50 145 Z" fill="#0D9488" opacity="0.9" />

  <!-- Pita Emas Kanan Bawah -->
  <path d="M105 208 C135 200 175 180 205 110 C198 135 175 170 135 190 C120 198 108 204 105 208 Z" fill="url(#ep-fav-gold-swoosh)" />

  <!-- Kotak Suara 3D -->
  <path d="M72 108 L120 135 L120 195 L72 165 Z" fill="url(#ep-fav-box-left)" />
  <path d="M120 135 L168 108 L168 165 L120 195 Z" fill="url(#ep-fav-box-right)" />
  <path d="M120 78 L168 108 L120 135 L72 108 Z" fill="url(#ep-fav-box-top)" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M102 104 L138 104" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />

  <!-- Surat Suara Putih -->
  <g transform="rotate(-6 120 85)">
    <polygon points="104,50 136,53 133,96 101,93" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <line x1="108" y1="62" x2="131" y2="64" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="108" y1="70" x2="128" y2="72" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="108" y1="78" x2="122" y2="80" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Perisai & Centang -->
  <g transform="translate(0, 5)">
    <path d="M120 120 L145 130 C145 155 135 172 120 180 C105 172 95 155 95 130 Z" fill="url(#ep-fav-shield)" stroke="#FFFFFF" stroke-width="2" />
    <path d="M108 145 L116 153 L132 137" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Kubus Piksel Digital -->
  <rect x="180" y="62" width="12" height="12" rx="2" fill="#10B981" />
  <rect x="195" y="80" width="14" height="14" rx="2.5" fill="#10B981" />
  <rect x="188" y="100" width="10" height="10" rx="2" fill="#10B981" opacity="0.85" />
  <rect x="170" y="78" width="15" height="15" rx="3" fill="#FBBF24" />
  <rect x="190" y="118" width="11" height="11" rx="2" fill="#F59E0B" opacity="0.9" />
</svg>
